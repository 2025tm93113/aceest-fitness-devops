apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-primary
  template:
    metadata:
      labels:
        app: aceest-shadow-primary
    spec:
      containers:
        - name: aceest
          image: 2025tm93113/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-primary-svc
spec:
  selector:
    app: aceest-shadow-primary
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-v3
  template:
    metadata:
      labels:
        app: aceest-shadow-v3
    spec:
      containers:
        - name: aceest
          image: 2025tm93113/aceest-fitness:v3.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-v3-svc
spec:
  selector:
    app: aceest-shadow-v3
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-nginx-conf
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        location / {
          mirror /mirror;
          proxy_pass http://aceest-shadow-primary-svc:5000;
        }
        location = /mirror {
          internal;
          proxy_pass http://aceest-shadow-v3-svc:5000$request_uri;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-proxy
  template:
    metadata:
      labels:
        app: aceest-shadow-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: shadow-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
spec:
  type: NodePort
  selector:
    app: aceest-shadow-proxy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30004
