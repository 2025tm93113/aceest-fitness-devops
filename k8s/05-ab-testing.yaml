apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-a
  template:
    metadata:
      labels:
        app: aceest-ab-a
    spec:
      containers:
        - name: aceest
          image: 2025tm93113/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-a-svc
spec:
  selector:
    app: aceest-ab-a
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-b
  template:
    metadata:
      labels:
        app: aceest-ab-b
    spec:
      containers:
        - name: aceest
          image: 2025tm93113/aceest-fitness:v3.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-b-svc
spec:
  selector:
    app: aceest-ab-b
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-nginx-conf
data:
  nginx.conf: |
    events {}
    http {
      upstream version_a { server aceest-ab-a-svc:5000; }
      upstream version_b { server aceest-ab-b-svc:5000; }
      map $http_x_version $target_upstream {
        default version_a;
        "B"     version_b;
      }
      server {
        listen 80;
        location / {
          proxy_pass http://$target_upstream;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-router
  template:
    metadata:
      labels:
        app: aceest-ab-router
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: ab-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-svc
spec:
  type: NodePort
  selector:
    app: aceest-ab-router
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30005
